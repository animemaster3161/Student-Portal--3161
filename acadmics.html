<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    :root {
        --bg-base: #EEF3FD;
        --surface: #FFFFFF;
        --surface-alt: #F2F6FE;
        --ink: #0F1B33;
        --ink-soft: #536079;
        --ink-faint: #96A1BC;

        --blue: #2E5CE6;
        --blue-light: #6C93FF;
        --blue-deep: #1A38A6;
        --blue-wash: rgba(46, 92, 230, 0.09);

        --indigo: #6355E0;
        --indigo-light: #9088F0;
        --indigo-wash: rgba(99, 85, 224, 0.09);

        --cyan: #0DA5C0;
        --cyan-light: #4FD3E8;
        --cyan-wash: rgba(13, 165, 192, 0.09);

        --amber: #D6900F;
        --amber-light: #F0B94A;
        --amber-wash: rgba(214, 144, 15, 0.11);

        --danger: #E14A3B;
        --danger-light: #F28E7C;
        --danger-wash: rgba(225, 74, 59, 0.08);

        --success: #1DA35F;
        --success-wash: rgba(29, 163, 95, 0.1);
        --border: rgba(15, 27, 51, 0.08);

        --shadow-sm: 0 2px 10px rgba(15, 27, 51, 0.05);
        --shadow-md: 0 14px 32px rgba(15, 27, 51, 0.08);
        --shadow-lg: 0 26px 56px rgba(20, 40, 100, 0.16);

        --sidebar-width: 272px;
        --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
        font-family: 'Inter', sans-serif;
        background: var(--bg-base);
        color: var(--ink);
        display: flex;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        position: relative;
        overflow-x: hidden;
    }

    .mesh { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .mesh span { position: absolute; border-radius: 50%; filter: blur(95px); opacity: 0.55; animation: drift 24s ease-in-out infinite alternate; }
    .mesh span:nth-child(1) { width: 560px; height: 560px; top: -180px; right: -140px; background: radial-gradient(circle, rgba(46,92,230,0.30), transparent 70%); }
    .mesh span:nth-child(2) { width: 460px; height: 460px; bottom: -160px; left: 18%; background: radial-gradient(circle, rgba(99,85,224,0.20), transparent 70%); animation-delay: -8s; }
    .mesh span:nth-child(3) { width: 420px; height: 420px; top: 32%; right: 8%; background: radial-gradient(circle, rgba(13,165,192,0.18), transparent 70%); animation-delay: -14s; }

    ::selection { background: var(--blue-light); color: #fff; }
    a { color: inherit; }
    a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--blue-light); outline-offset: 3px; border-radius: 8px; }

    /* ============ SIDEBAR ============ */
    .sidebar {
        width: var(--sidebar-width);
        background: linear-gradient(180deg, #0A1230 0%, #101E4C 55%, #142A63 100%);
        padding: 30px 20px;
        display: flex;
        flex-direction: column;
        position: fixed;
        height: 100vh;
        z-index: 10;
        overflow: hidden;
    }
    .sidebar::before {
        content: "";
        position: absolute;
        width: 320px; height: 320px;
        top: -110px; left: -110px;
        background: radial-gradient(circle, rgba(108,147,255,0.25), transparent 70%);
        filter: blur(40px);
        pointer-events: none;
    }
    .sidebar > * { position: relative; z-index: 1; }

    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; padding: 0 6px; }
    .logo-mark {
        width: 42px; height: 42px;
        border-radius: 13px;
        background: linear-gradient(145deg, var(--blue-light), var(--blue-deep));
        display: flex; align-items: center; justify-content: center;
        color: #fff;
        font-family: 'Sora', sans-serif;
        font-weight: 700;
        font-size: 15px;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 10px 22px rgba(46,92,230,0.4);
        flex-shrink: 0;
    }
    .logo-text { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 16.5px; color: #fff; letter-spacing: 0.2px; line-height: 1.15; }
    .logo-text span { display: block; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 11px; color: rgba(255,255,255,0.45); letter-spacing: 0.4px; margin-top: 2px; }

    .nav-section-label { font-size: 10.5px; font-weight: 600; letter-spacing: 1px; color: rgba(255,255,255,0.32); text-transform: uppercase; margin: 32px 12px 12px; }

    .nav-links { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .nav-links li a {
        text-decoration: none;
        color: rgba(255,255,255,0.64);
        font-weight: 500;
        font-size: 14.5px;
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 11px 14px;
        border-radius: 12px;
        position: relative;
        transition: color .25s var(--ease), background-color .25s var(--ease), transform .25s var(--ease);
    }
    .nav-links li a i { width: 18px; text-align: center; font-size: 15px; }
    .nav-links li a:hover { background: rgba(255,255,255,0.07); color: #fff; transform: translateX(2px); }
    .nav-links li a.active {
        background: linear-gradient(120deg, var(--blue-light), var(--blue));
        color: #fff;
        box-shadow: 0 10px 24px rgba(46,92,230,0.38);
    }

    .profile-mini {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px;
        border-radius: 15px;
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.1);
    }
    .profile-mini .avatar {
        width: 38px; height: 38px; border-radius: 50%;
        background: linear-gradient(145deg, var(--cyan-light), var(--cyan));
        display: flex; align-items: center; justify-content: center;
        font-family: 'Sora', sans-serif; font-weight: 700; font-size: 14px; color: #fff;
        flex-shrink: 0;
    }
    .profile-mini .info { flex: 1; min-width: 0; }
    .profile-mini .info strong { display: block; font-size: 13px; color: #fff; font-weight: 600; }
    .profile-mini .info span { font-size: 11.5px; color: rgba(255,255,255,0.42); font-family: 'JetBrains Mono', monospace; }
    .profile-mini i { color: rgba(255,255,255,0.42); cursor: pointer; }

    /* ============ MAIN ============ */
    .main-content { margin-left: var(--sidebar-width); padding: 36px 46px 60px; width: calc(100% - var(--sidebar-width)); position: relative; z-index: 1; }

    /* ---- Page header ---- */
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
    .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; color: var(--blue); letter-spacing: 0.6px; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 0 rgba(29,163,95,0.45); animation: dotPulse 2.4s infinite; }
    .page-header h1 { font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.4px; }

    .back-btn {
        display: inline-flex; align-items: center; gap: 9px;
        background: var(--surface); border: 1px solid var(--border); color: var(--ink-soft);
        font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13.5px;
        padding: 10px 18px 10px 14px; border-radius: 12px; cursor: pointer;
        box-shadow: var(--shadow-sm); transition: transform .25s var(--ease), box-shadow .25s var(--ease), color .25s var(--ease);
    }
    .back-btn:hover { transform: translateX(-3px); box-shadow: var(--shadow-md); color: var(--blue); }

    /* ============ VIEWS ============ */
    .view { display: none; }
    .view.active { display: block; opacity: 0; transform: translateY(12px); animation: cardIn .45s var(--ease) forwards; }

    /* ---- VIEW 1: Subject grid ---- */
    .subject-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }

    .subject-card {
        background: var(--surface); border-radius: 20px; padding: 24px;
        border: 1px solid var(--border); box-shadow: var(--shadow-sm);
        transition: transform .35s var(--ease), box-shadow .35s var(--ease);
        display: flex; flex-direction: column; gap: 16px;
    }
    .subject-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }

    .subject-head { display: flex; align-items: center; gap: 13px; }
    .subject-icon { width: 46px; height: 46px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #fff; flex-shrink: 0; }
    .icon-indigo { background: linear-gradient(145deg, var(--indigo-light), var(--indigo)); box-shadow: 0 8px 16px rgba(99,85,224,0.3); }
    .icon-blue { background: linear-gradient(145deg, var(--blue-light), var(--blue-deep)); box-shadow: 0 8px 16px rgba(46,92,230,0.3); }
    .icon-cyan { background: linear-gradient(145deg, var(--cyan-light), var(--cyan)); box-shadow: 0 8px 16px rgba(13,165,192,0.3); }
    .icon-amber { background: linear-gradient(145deg, var(--amber-light), var(--amber)); box-shadow: 0 8px 16px rgba(214,144,15,0.3); }
    .subject-head h3 { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700; }
    .subject-head p { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--ink-faint); margin-top: 3px; }

    .subject-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .btn {
        border: none; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px;
        padding: 11px 12px; border-radius: 11px; display: flex; align-items: center; justify-content: center; gap: 7px;
        transition: transform .25s var(--ease), box-shadow .25s var(--ease), background .25s var(--ease), color .25s var(--ease);
        text-decoration: none;
    }
    .btn-ghost { background: var(--surface-alt); color: var(--ink); }
    .btn-ghost:hover { background: var(--blue-wash); color: var(--blue); transform: translateY(-2px); }
    .btn-primary { grid-column: 1 / -1; background: linear-gradient(145deg, var(--blue-light), var(--blue-deep)); color: #fff; box-shadow: 0 10px 22px rgba(46,92,230,0.32); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(46,92,230,0.4); }

    .pyq-toggle { border-top: 1px solid var(--border); padding-top: 14px; }
    .pyq-toggle summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
    .pyq-toggle summary::-webkit-details-marker { display: none; }
    .pyq-toggle summary i { transition: transform .25s var(--ease); font-size: 11px; }
    .pyq-toggle[open] summary i { transform: rotate(180deg); }
    .pyq-links { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
    .pyq-links a { font-size: 12.5px; color: var(--ink); background: var(--surface-alt); padding: 9px 12px; border-radius: 9px; display: flex; align-items: center; justify-content: space-between; transition: background .2s var(--ease), color .2s var(--ease); }
    .pyq-links a:hover { background: var(--indigo-wash); color: var(--indigo); }

    /* ---- VIEW 2: Chapter list ---- */
    .chapter-list { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
    .chapter-item {
        background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
        padding: 16px 20px; display: flex; align-items: center; gap: 18px; box-shadow: var(--shadow-sm);
        transition: box-shadow .3s var(--ease), transform .3s var(--ease);
    }
    .chapter-item:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .chapter-num { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-alt); color: var(--ink-soft); font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .chapter-info { flex: 1; min-width: 0; }
    .chapter-info h4 { font-family: 'Sora', sans-serif; font-size: 14.5px; font-weight: 700; }
    .chapter-info p { font-size: 12px; color: var(--ink-faint); margin-top: 3px; }
    .chapter-item.done .chapter-num { background: var(--success-wash); color: var(--success); }
    .chapter-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .chapter-actions .btn { padding: 9px 14px; }
    .btn-watch { background: linear-gradient(145deg, var(--blue-light), var(--blue-deep)); color: #fff; box-shadow: 0 8px 18px rgba(46,92,230,0.3); }
    .btn-watch:hover { transform: translateY(-2px); }

    /* ---- VIEW 3: Video Study Room ---- */
    .study-room { display: flex; gap: 22px; margin-top: 22px; align-items: flex-start; }
    .video-panel { flex: 0 0 70%; min-width: 0; }
    .video-frame { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 18px; overflow: hidden; background: #0A1230; box-shadow: var(--shadow-lg); }
    .video-frame iframe { width: 100%; height: 100%; border: none; }
    .now-playing { margin-top: 16px; }
    .now-playing h3 { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 700; }
    .now-playing p { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }

    .playlist-panel { flex: 0 0 30%; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px; box-shadow: var(--shadow-sm); }
    .playlist-panel h4 { font-family: 'Sora', sans-serif; font-size: 13.5px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
    .playlist-item {
        display: flex; align-items: center; gap: 11px; padding: 11px 10px; border-radius: 11px; cursor: pointer;
        transition: background .2s var(--ease); margin-bottom: 4px;
    }
    .playlist-item:hover { background: var(--surface-alt); }
    .playlist-item.active { background: var(--blue-wash); }
    .playlist-item .p-num { width: 26px; height: 26px; border-radius: 8px; background: var(--surface-alt); color: var(--ink-faint); font-family: 'JetBrains Mono', monospace; font-size: 11.5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .playlist-item.active .p-num { background: var(--blue); color: #fff; }
    .playlist-item.completed .p-num { background: var(--success-wash); color: var(--success); }
    .playlist-item.completed .p-num i { font-size: 10.5px; }
    .playlist-item .p-title { font-size: 12.5px; font-weight: 600; color: var(--ink); flex: 1; }
    .playlist-item.active .p-title { color: var(--blue-deep); }

    /* ============ KEYFRAMES ============ */
    @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }
    @keyframes dotPulse { 0% { box-shadow: 0 0 0 0 rgba(29,163,95,0.45); } 70% { box-shadow: 0 0 0 9px rgba(29,163,95,0); } 100% { box-shadow: 0 0 0 0 rgba(29,163,95,0); } }
    @keyframes drift { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-40px, 30px) scale(1.08); } }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
        .view.active, .subject-card { opacity: 1; transform: none; }
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 1080px) {
        .study-room { flex-direction: column; }
        .video-panel, .playlist-panel { flex: 1 1 100%; width: 100%; }
    }
    @media (max-width: 780px) {
        .sidebar { display: none; }
        .main-content { margin-left: 0; width: 100%; padding: 22px; }
        .subject-grid { grid-template-columns: 1fr; }
        .chapter-item { flex-wrap: wrap; }
        .chapter-actions { width: 100%; justify-content: flex-start; }
    }
</style>
</head>

<script>
/* ============ DATA ============ */
const SUBJECTS = {
    dbms: {
        name: "Database Management Systems", code: "DBMS · CS301", icon: "fa-database", cls: "icon-indigo",
        assignments: "https://drive.google.com/drive/folders/PLACEHOLDER_DBMS_ASSIGNMENTS",
        labManuals: "https://drive.google.com/drive/folders/PLACEHOLDER_DBMS_LAB",
        pyqs: [
            { label: "2024 End Semester", url: "https://drive.google.com/drive/folders/PLACEHOLDER_DBMS_PYQ_2024" },
            { label: "2023 End Semester", url: "https://drive.google.com/drive/folders/PLACEHOLDER_DBMS_PYQ_2023" }
        ],
        chapters: [
            { title: "Introduction to DBMS", videoId: "M7lc1UVf-VE", notes: "https://drive.google.com/drive/folders/PLACEHOLDER_DBMS_C1_NOTES", practice: "https://drive.google.com/drive/folders/PLACEHOLDER_DBMS_C1_PRACTICE" },
            { title: "ER Model & Relational Model", videoId: "M7lc1UVf-VE", notes: "https://drive.google.com/drive/folders/PLACEHOLDER_DBMS_C2_NOTES", practice: "https://drive.google.com/drive/folders/PLACEHOLDER_DBMS_C2_PRACTICE" },
            { title: "Normalization (1NF–BCNF)", videoId: "M7lc1UVf-VE", notes: "https://drive.google.com/drive/folders/PLACEHOLDER_DBMS_C3_NOTES", practice: "https://drive.google.com/drive/folders/PLACEHOLDER_DBMS_C3_PRACTICE" }
        ]
    },
    os: {
        name: "Operating Systems", code: "OS · CS302", icon: "fa-microchip", cls: "icon-blue",
        assignments: "https://drive.google.com/drive/folders/PLACEHOLDER_OS_ASSIGNMENTS",
        labManuals: "https://drive.google.com/drive/folders/PLACEHOLDER_OS_LAB",
        pyqs: [
            { label: "2024 End Semester", url: "https://drive.google.com/drive/folders/PLACEHOLDER_OS_PYQ_2024" },
            { label: "2023 End Semester", url: "https://drive.google.com/drive/folders/PLACEHOLDER_OS_PYQ_2023" }
        ],
        chapters: [
            { title: "Process Management", videoId: "M7lc1UVf-VE", notes: "https://drive.google.com/drive/folders/PLACEHOLDER_OS_C1_NOTES", practice: "https://drive.google.com/drive/folders/PLACEHOLDER_OS_C1_PRACTICE" },
            { title: "CPU Scheduling Algorithms", videoId: "M7lc1UVf-VE", notes: "https://drive.google.com/drive/folders/PLACEHOLDER_OS_C2_NOTES", practice: "https://drive.google.com/drive/folders/PLACEHOLDER_OS_C2_PRACTICE" },
            { title: "Deadlocks & Memory Management", videoId: "M7lc1UVf-VE", notes: "https://drive.google.com/drive/folders/PLACEHOLDER_OS_C3_NOTES", practice: "https://drive.google.com/drive/folders/PLACEHOLDER_OS_C3_PRACTICE" }
        ]
    }
};

const STORAGE_KEY = "academics_completed_v1";
let completed = {}; // { "dbms:0": true, ... }
try { completed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
catch (e) { console.warn("localStorage unavailable, progress won't persist:", e); }

function saveCompleted() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(completed)); }
    catch (e) { /* progress just won't persist across reloads */ }
}

let activeSubjectKey = null;
let activeChapterIndex = null;
let ytPlayer = null;
let ytReady = false;

/* ============ VIEW SWITCHING ============ */
function showView(id) {
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

/* ============ VIEW 1: RENDER SUBJECT GRID ============ */
function renderSubjects() {
    const grid = document.getElementById("subjectGrid");
    grid.innerHTML = Object.entries(SUBJECTS).map(([key, s]) => `
        <div class="subject-card">
            <div class="subject-head">
                <div class="subject-icon ${s.cls}"><i class="fas ${s.icon}"></i></div>
                <div><h3>${s.name}</h3><p>${s.code}</p></div>
            </div>
            <div class="subject-actions">
                <a class="btn btn-ghost" href="${s.assignments}" target="_blank" rel="noopener"><i class="fas fa-file-upload"></i> Assignments</a>
                <a class="btn btn-ghost" href="${s.labManuals}" target="_blank" rel="noopener"><i class="fas fa-flask"></i> Lab Manuals</a>
                <button class="btn btn-primary" onclick="openChapters('${key}')"><i class="fas fa-layer-group"></i> View Chapters</button>
            </div>
            <details class="pyq-toggle">
                <summary>PYQs <i class="fas fa-chevron-down"></i></summary>
                <div class="pyq-links">
                    ${s.pyqs.map(p => `<a href="${p.url}" target="_blank" rel="noopener">${p.label} <i class="fas fa-arrow-up-right-from-square"></i></a>`).join("")}
                </div>
            </details>
        </div>
    `).join("");
}

/* ============ VIEW 2: RENDER CHAPTER LIST ============ */
function openChapters(key) {
    activeSubjectKey = key;
    const s = SUBJECTS[key];
    document.getElementById("pageTitle").textContent = s.name;
    const list = document.getElementById("chapterList");
    list.innerHTML = s.chapters.map((c, i) => `
        <div class="chapter-item ${completed[key + ':' + i] ? 'done' : ''}">
            <div class="chapter-num">${completed[key + ':' + i] ? '<i class="fas fa-check"></i>' : i + 1}</div>
            <div class="chapter-info"><h4>${c.title}</h4><p>Chapter ${i + 1}</p></div>
            <div class="chapter-actions">
                <button class="btn btn-watch" onclick="openPlayer('${key}', ${i})"><i class="fas fa-play"></i> Watch Video</button>
                <a class="btn btn-ghost" href="${c.notes}" target="_blank" rel="noopener"><i class="fas fa-file-lines"></i> Notes</a>
                <a class="btn btn-ghost" href="${c.practice}" target="_blank" rel="noopener"><i class="fas fa-pen"></i> Practice</a>
            </div>
        </div>
    `).join("");
    showView("viewChapters");
}

function backToChapters() {
    openChapters(activeSubjectKey);
}

/* ============ VIEW 3: VIDEO STUDY ROOM ============ */
function openPlayer(key, index) {
    activeSubjectKey = key;
    activeChapterIndex = index;
    document.getElementById("pageTitle").textContent = SUBJECTS[key].name;
    renderPlaylist();
    loadChapter(index);
    showView("viewPlayer");
}

function renderPlaylist() {
    const s = SUBJECTS[activeSubjectKey];
    const wrap = document.getElementById("playlistItems");
    wrap.innerHTML = s.chapters.map((c, i) => {
        const key = activeSubjectKey + ':' + i;
        const isActive = i === activeChapterIndex;
        const isDone = !!completed[key];
        return `
            <div class="playlist-item ${isActive ? 'active' : ''} ${isDone ? 'completed' : ''}" data-index="${i}" onclick="loadChapter(${i})">
                <div class="p-num">${isDone ? '<i class="fas fa-check"></i>' : i + 1}</div>
                <div class="p-title">${c.title}</div>
            </div>
        `;
    }).join("");
}

function loadChapter(index) {
    activeChapterIndex = index;
    const s = SUBJECTS[activeSubjectKey];
    const c = s.chapters[index];
    document.getElementById("npTitle").textContent = c.title;
    document.getElementById("npSubject").textContent = s.name;
    renderPlaylist();

    if (!ytReady) return; // player will load this chapter once the API signals ready
    if (ytPlayer) {
        ytPlayer.loadVideoById(c.videoId);
    } else {
        createPlayer(c.videoId);
    }
}

function markCompleted(key, index) {
    completed[key + ':' + index] = true;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(completed));
    renderPlaylist();
}

/* ============ YOUTUBE IFRAME API ============ */
function createPlayer(videoId) {
    ytPlayer = new YT.Player("ytPlayer", {
        videoId: videoId,
        playerVars: { rel: 0, modestbranding: 1 },
        events: { onStateChange: onPlayerStateChange }
    });
}

function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.ENDED) {
        // Halt on the ended frame — no auto-advance to the next chapter.
        markCompleted(activeSubjectKey, activeChapterIndex);
    }
}

function onYouTubeIframeAPIReady() {
    ytReady = true;
    if (activeSubjectKey !== null && activeChapterIndex !== null) {
        createPlayer(SUBJECTS[activeSubjectKey].chapters[activeChapterIndex].videoId);
    }
}

/* ============ INIT ============ */
renderSubjects();
</script>
<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
