<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060a12">
  <title>Forgot Password | MGMCOET Student Portal</title>
  <link rel="icon" type="image/jpeg" href="mgmcoet-mark.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="password-recovery.css">
</head>
<body>
  <div class="bg-wrap" aria-hidden="true">
    <video autoplay muted loop playsinline preload="metadata"><source src="bg.mp4" type="video/mp4"></video>
    <div class="bg-scrim"></div>
  </div>

  <div class="mgm-badge">
    <div class="name">MGMCOET</div>
    <div class="sub">Unofficial Student Portal</div>
  </div>

  <main class="stage">
    <section class="card" aria-labelledby="pageTitle">
      <div class="eyebrow">Account recovery</div>
      <h1 id="pageTitle">Forgot password?</h1>
      <p class="tagline">Enter your registered email or roll number. We’ll send you a secure link to choose a new password.</p>

      <form id="recoveryForm">
        <div class="field">
          <label for="accountId">Registered email or roll number</label>
          <input id="accountId" name="accountId" type="text" autocomplete="username" required>
        </div>
        <div id="recoveryMessage" class="form-message" role="status" aria-live="polite"></div>
        <button id="sendLinkButton" class="btn-primary" type="submit">Send reset link</button>
      </form>

      <nav class="page-links" aria-label="Account links">
        <a href="login.html">Back to sign in</a>
      </nav>
    </section>
  </main>

  <script type="module">
    import { resetPasswordRequest } from './auth.js';

    const form = document.getElementById('recoveryForm');
    const accountId = document.getElementById('accountId');
    const message = document.getElementById('recoveryMessage');
    const button = document.getElementById('sendLinkButton');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `form-message show ${type}`;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const identifier = accountId.value.trim();
      if (!identifier) {
        showMessage('Enter your registered email or roll number.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'Sending…';
      message.className = 'form-message';
      try {
        await resetPasswordRequest(identifier);
        showMessage('If the account matches, a reset link is on its way. Check your inbox and Spam/Junk folder.', 'success');
      } catch (error) {
        showMessage(error.message || 'Unable to send the reset link. Please try again.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'Send reset link';
      }
    });
  </script>
</body>
</html>
