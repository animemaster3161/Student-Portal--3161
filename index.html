<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal | MGMCOET</title>
  <link rel="icon" type="image/jpeg" href="mgmcoet-mark.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root{
    --bg-base:#EEF3FD;
    --ink:#0F1B33;
    --ink-soft:#536079;
    --blue:#2E5CE6;
    --blue-light:#6C93FF;
    --blue-deep:#1A38A6;
    --sidebar-width:272px;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  html.portal-dark-mode{color-scheme:dark;--bg-base:#0B1220;--ink:#E7EDF7;--ink-soft:#B1BED2;}
  *{margin:0;padding:0;box-sizing:border-box;}
html{overflow-x:hidden;max-width:100vw;}
  html,body{height:100%;height:100svh;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--bg-base);
    color:var(--ink);
    display:flex;
    min-height:100vh;
    min-height:100svh;
    overflow:hidden;
  }

  /* ============ SIDEBAR (persistent shell) ============ */
  .sidebar{
    width:var(--sidebar-width);
    flex-shrink:0;
    background:linear-gradient(180deg,#0A1230 0%,#101E4C 55%,#142A63 100%);
    padding:30px 20px;
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100svh;
    position:relative;
    overflow-x:hidden;
    overflow-y:hidden;
    z-index:10;
  }
  .sidebar::before{
    content:"";
    position:absolute;
    width:320px;height:320px;
    top:-110px;left:-110px;
    background:radial-gradient(circle, rgba(108,147,255,0.25), transparent 70%);
    filter:blur(40px);
    pointer-events:none;
  }
  .sidebar > *{position:relative;z-index:1;}

  .logo{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding:0 6px;}
  .logo-mark{
    width:42px;height:42px;border-radius:13px;
    background:linear-gradient(145deg,var(--blue-light),var(--blue-deep));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:'Sora',sans-serif;font-weight:700;font-size:15px;
    box-shadow:0 0 0 1px rgba(255,255,255,0.1),0 10px 22px rgba(46,92,230,0.4);
    flex-shrink:0;
  }
  .logo-text{font-family:'Sora',sans-serif;font-weight:700;font-size:16.5px;color:#fff;letter-spacing:.2px;line-height:1.15;}
  .logo-text span{display:block;font-family:'Inter',sans-serif;font-weight:500;font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.4px;margin-top:2px;}

  .nav-section-label{font-size:10.5px;font-weight:600;letter-spacing:1px;color:rgba(255,255,255,.32);text-transform:uppercase;margin:28px 12px 12px;}

  .nav-links{list-style:none;display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;}
  .nav-links::-webkit-scrollbar{display:none;width:0;height:0;}
  .nav-links li a{
    display:flex;align-items:center;gap:12px;
    padding:11px 14px;border-radius:11px;
    color:rgba(255,255,255,.62);text-decoration:none;
    font-size:14px;font-weight:500;
    transition:background .18s ease,color .18s ease,transform .18s ease;
  }
  .nav-links li a i{width:18px;text-align:center;font-size:15px;}
  .nav-links li a:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(2px);}
  .nav-links li a.active{
    background:linear-gradient(135deg,rgba(46,92,230,.9),rgba(99,85,224,.85));
    color:#fff;
    box-shadow:0 8px 20px rgba(46,92,230,.35);
  }

  .profile-mini{
    display:flex;align-items:center;gap:10px;
    padding:12px;margin-top:14px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;cursor:pointer;
    transition:background .18s ease;
  }
  .profile-mini:hover{background:rgba(255,255,255,.1);}
  .profile-mini .avatar{
    width:36px;height:36px;border-radius:50%;
    background:linear-gradient(145deg,var(--blue-light),var(--blue-deep));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:14px;flex-shrink:0;
    overflow:hidden;
  }
  .profile-mini .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .profile-mini .info{flex:1;overflow:hidden;}
  .profile-mini .info strong{display:block;font-size:13px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .profile-mini .info span{font-size:11px;color:rgba(255,255,255,.45);}
  .profile-mini i{color:rgba(255,255,255,.4);font-size:13px;}

  .logout-btn{
    margin-top:10px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:11px;border-radius:11px;
    background:rgba(225,74,59,.14);
    border:1px solid rgba(225,74,59,.25);
    color:#ffb3ab;font-size:13px;font-weight:600;
    cursor:pointer;transition:background .18s ease;
  }
  .logout-btn:hover{background:rgba(225,74,59,.24);}

  /* ============ CONTENT AREA ============ */
  .content-area{
    flex:1;
    height:100vh;
    height:100svh;
    position:relative;
    overflow:hidden;
  }
  .content-area iframe{
    width:100%;height:100%;border:none;display:block;
  }
  .loader{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg-base);
    z-index:2;transition:opacity .25s ease;
  }
  .loader.hide{opacity:0;pointer-events:none;}
  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:3px solid rgba(46,92,230,.15);
    border-top-color:var(--blue);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Mobile hamburger */
  .menu-toggle{
    display:none;
    position:fixed;top:16px;left:16px;z-index:20;
    width:42px;height:42px;border-radius:11px;
    background:#101E4C;color:#fff;border:none;
    align-items:center;justify-content:center;font-size:17px;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
    cursor:pointer;
  }
  .sidebar-scrim{
    display:none;
    position:fixed;inset:0;background:rgba(6,10,20,.5);z-index:9;
  }

  @media (max-width:900px){
    .menu-toggle{display:flex;}
    .sidebar{
      position:fixed;top:0;left:0;
      transform:translateX(-100%);
      transition:transform .3s var(--ease);
      width:78vw;max-width:300px;
      overflow-y:hidden;
      overscroll-behavior:contain;
      padding-top:max(24px, env(safe-area-inset-top));
      padding-bottom:max(20px, env(safe-area-inset-bottom));
    }
    .sidebar.open{transform:translateX(0);}
    .sidebar .nav-links{flex:1 1 0%;min-height:0;overflow-y:auto;overscroll-behavior:contain;}
    .sidebar .profile-mini{margin-top:auto;}
    .sidebar .profile-mini,.sidebar .logout-btn{flex-shrink:0;}
    .sidebar .profile-mini .info{min-width:0;}
    .sidebar .profile-mini > i{flex:none;}
    .sidebar-scrim.show{display:block;}
    .content-area{width:100%;}
    .mobile-nav-open .menu-toggle{opacity:0;visibility:hidden;pointer-events:none;}
  }
</style>
</head>
<body>

<button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><i class="fas fa-bars"></i></button>
<div class="sidebar-scrim" id="scrim"></div>

<nav class="sidebar" id="sidebar">
  <div class="logo">
    <img class="logo-mark" src="mgmcoet-mark.jpg" alt="" style="display:block;background:transparent;box-shadow:none;border-radius:0;object-fit:contain">
    <div class="logo-text">MGMCOET<span>Student Portal</span></div>
  </div>

  <div class="nav-section-label">Menu</div>
  <ul class="nav-links" id="navLinks">
    <li><a href="#dashboard" data-route="dashboard"><i class="fas fa-grip"></i> Dashboard</a></li>
    <li><a href="#academics" data-route="academics"><i class="fas fa-book"></i> Academics</a></li>
    <li><a href="#attendance" data-route="attendance"><i class="fas fa-calendar-check"></i> Attendance</a></li>
    <li><a href="#elibrary" data-route="elibrary"><i class="fas fa-book-reader"></i> E-Library</a></li>
    <li><a href="#community" data-route="community"><i class="fas fa-comments"></i> Community</a></li>
    <li><a href="#confession" data-route="confession"><i class="fas fa-mask"></i> Confessions</a></li>
    <li><a href="#notice" data-route="notice"><i class="fas fa-bullhorn"></i> All Notices</a></li>
    <li><a href="#settings" data-route="settings"><i class="fas fa-cog"></i> Settings</a></li>
  </ul>

  <div class="profile-mini" id="profileMini">
    <div class="avatar" id="avatarLetter">S</div>
    <div class="info">
      <strong id="profileName">Student</strong>
      <span id="profileId">—</span>
    </div>
    <i class="fas fa-ellipsis-vertical"></i>
  </div>
  <div class="logout-btn" id="logoutBtn"><i class="fas fa-arrow-right-from-bracket"></i> Sign out</div>
</nav>

<div class="content-area">
  <div class="loader" id="loader"><div class="spinner"></div></div>
  <iframe id="contentFrame" title="Portal content"></iframe>
</div>

<script>
  // ---- Route map ----
  const routes = {
    dashboard: 'dashboard.html',
    academics: 'acadmics.html',
    attendance: 'attendence.html',
    elibrary: 'elibrary.html',
    community: 'community.html',
    confession: 'confession.html',
    notice: 'notice.html',
    settings: 'setting_account.html'
  };

  const frame = document.getElementById('contentFrame');
  const loader = document.getElementById('loader');
  window.portalAuthReady = false;
  const PORTAL_THEME_KEY = 'mgm_portal_dark_mode';
  const PORTAL_PREFERENCES_KEY = 'mgm_portal_preferences';
  const frameTheme = document.createElement('style');
  frameTheme.id = 'portal-dark-theme';
  frameTheme.textContent = `
    :root{color-scheme:dark!important}
    html,body{background:#0b1220!important;color:#e7edf7!important}
    body{--bg-base:#0b1220;--surface:#141f31;--surface-alt:#1b2a40;--ink:#e7edf7;--ink-soft:#b1bed2;--ink-faint:#8594ab;--border:rgba(210,225,245,.13)}
    body :is(.main-content,.content-area,.view,.panel,.settings-nav,.pane,.card,.subject-card,.chapter-card,.assignment-card,.notice-card,.resource-card,.study-resources-panel,.dashboard-card,.stat-card,.routine-card,.attendance-card,.fixed-bottom-bar,.modal-box,.modal-card,.modal-panel,.viewer-panel,.document-viewer-panel){background-color:#141f31!important;color:#e7edf7!important;border-color:rgba(210,225,245,.13)!important}
    body :is(input,select,textarea){background-color:#0f1929!important;color:#e7edf7!important;border-color:#34435b!important}
    body :is(h1,h2,h3,h4,h5,p,label,small,td,th,.empty-note,.pane-subtitle,.config-info p){color:#d7e1f0!important}
    body :is(.sidebar,.chat-list,.chat-sidebar){background-color:#0a1120!important}
    body .message-menu-trigger{background:#1b2a40!important;color:#d7e1f0!important;border-color:rgba(210,225,245,.16)!important;box-shadow:0 5px 18px rgba(0,0,0,.28)!important}
    body .message-action-popover{background:rgba(20,31,49,.98)!important;color:#e7edf7!important;border-color:rgba(210,225,245,.16)!important;box-shadow:0 16px 42px rgba(0,0,0,.48)!important}
    body .reaction-picker{border-bottom-color:rgba(210,225,245,.16)!important}
    body .reaction-picker button,body .message-menu-item{color:#e7edf7!important}
    body .reaction-picker button:hover,body .reaction-picker button:focus-visible,body .message-menu-item:hover{background:#263750!important}
    body .message-menu-item.danger{color:#ff8996!important}
    body .reaction-chip{background:#1b2a40!important;color:#e7edf7!important;border-color:rgba(210,225,245,.18)!important}
    body .reaction-chip.mine{background:#203c70!important;border-color:#6c93ff!important}
  `;

  function applyPortalDarkMode(enabled) {
    document.documentElement.classList.toggle('portal-dark-mode', enabled);
    try { localStorage.setItem(PORTAL_THEME_KEY, enabled ? '1' : '0'); } catch (_) {}
    try { document.cookie = `${PORTAL_THEME_KEY}=${enabled ? '1' : '0'}; Path=/; Max-Age=31536000; SameSite=Lax`; } catch (_) {}
    const doc = frame.contentDocument;
    if (!doc?.head) return;
    const existingTheme = doc.getElementById('portal-dark-theme');
    if (enabled && !existingTheme) doc.head.append(frameTheme.cloneNode(true));
    else if (!enabled) existingTheme?.remove();
  }
  window.setPortalDarkMode = applyPortalDarkMode;
  function readPortalPreferences() {
    try {
      const value = JSON.parse(localStorage.getItem(PORTAL_PREFERENCES_KEY) || '{}');
      return value && typeof value === 'object' ? value : {};
    } catch (_) { return {}; }
  }
  function applyPortalPreferences(preferences = readPortalPreferences()) {
    const compact = Boolean(preferences.compact);
    document.documentElement.classList.toggle('portal-compact-mode', compact);
    const doc = frame.contentDocument;
    if (!doc?.head) return;
    let style = doc.getElementById('portal-compact-mode-style');
    if (compact && !style) {
      style = doc.createElement('style');
      style.id = 'portal-compact-mode-style';
      style.textContent = `
        html.portal-compact-mode body :is(.pane,.card,.subject-card,.chapter-card,.assignment-card,.notice-card,.resource-card,.dashboard-card,.stat-card,.routine-card,.attendance-card){padding:16px!important}
        html.portal-compact-mode body :is(.config-row,.form-group){margin-bottom:12px!important}
      `;
      doc.head.append(style);
    } else if (!compact) style?.remove();
    doc.documentElement.classList.toggle('portal-compact-mode', compact);
  }
  window.applyPortalPreferences = applyPortalPreferences;
  applyPortalPreferences();
  window.addEventListener('storage', (event) => {
    if (event.key === PORTAL_PREFERENCES_KEY) applyPortalPreferences(readPortalPreferences());
  });
  function readPortalDarkMode() {
    try {
      const match = document.cookie.match(new RegExp(`(?:^|;\\s*)${PORTAL_THEME_KEY}=([01])`));
      if (match) return match[1] === '1';
    } catch (_) {}
    try { return localStorage.getItem(PORTAL_THEME_KEY) === '1'; } catch (_) { return false; }
  }
  applyPortalDarkMode(readPortalDarkMode());
  window.addEventListener('storage', (event) => {
    if (event.key === PORTAL_THEME_KEY) applyPortalDarkMode(event.newValue === '1');
  });
  const navLinks = document.querySelectorAll('#navLinks a');
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');

  function setActive(route){
    navLinks.forEach(a => a.classList.toggle('active', a.dataset.route === route));
  }

  function loadRoute(){
    if (!window.portalAuthReady) return;
    let route = (window.location.hash || `#${readPortalPreferences().landingPage || 'dashboard'}`).replace('#','');
    if(!routes[route]) route = 'dashboard';
    loader.classList.remove('hide');
    frame.src = routes[route];
    setActive(route);
    closeMobileNav();
  }

  frame.addEventListener('load', () => {
    loader.classList.add('hide');
    applyPortalDarkMode(readPortalDarkMode());
    applyPortalPreferences();
  });

  window.addEventListener('hashchange', loadRoute);
  window.addEventListener('DOMContentLoaded', loadRoute);
  window.loadPortalRoute = loadRoute;

  // ---- Mobile nav toggle ----
  const menuToggle = document.getElementById('menuToggle');
  function openMobileNav(){
    sidebar.classList.add('open'); scrim.classList.add('show');
    document.body.classList.add('mobile-nav-open');
    menuToggle.setAttribute('aria-expanded', 'true');
  }
  function closeMobileNav(){
    sidebar.classList.remove('open'); scrim.classList.remove('show');
    document.body.classList.remove('mobile-nav-open');
    menuToggle.setAttribute('aria-expanded', 'false');
  }
  document.getElementById('menuToggle').addEventListener('click', openMobileNav);
  scrim.addEventListener('click', closeMobileNav);
</script>

<script src="ui-feedback.js"></script>
<script type="module">
  import { requireAuth, loadProfile, signOut, supabase } from './auth.js';
  import { sendPortalNotification, requestBrowserNotifications } from './portal-notifications.js';

  window.requestPortalNotificationPermission = requestBrowserNotifications;

  function mutedConversationIds() {
    try { return new Set(JSON.parse(localStorage.getItem('mgm_chat_muted') || '[]')); }
    catch { return new Set(); }
  }

  function startPortalNotifications(userId, profile, userMetadata = {}) {
    const branch = profile?.branch || userMetadata.branch || '';
    const year = profile?.year || userMetadata.year || '';
    const blocked = new Set();
    supabase.from('blocks').select('blocked').eq('blocker', userId)
      .then(({ data }) => (data || []).forEach((row) => blocked.add(row.blocked)));

    const channel = supabase.channel(`portal-notifications-${userId}`);
    channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, async ({ new: message }) => {
      if (!message || message.sender_id === userId || blocked.has(message.sender_id)) return;
      const { data: conversation } = await supabase.from('conversations')
        .select('id,user_a,user_b,is_group,group_name,cleared_before_a,cleared_before_b')
        .eq('id', message.conversation_id).maybeSingle();
      if (!conversation) return;
      let senderName = 'A student';
      let title = 'New message';
      if (conversation.is_group) {
        const { data: members } = await supabase.from('group_members')
          .select('user_id,joined_at').eq('conversation_id', conversation.id);
        const me = members?.find((member) => member.user_id === userId);
        if (!me || (me.joined_at && new Date(message.created_at) < new Date(me.joined_at))) return;
        senderName = (await supabase.from('profiles').select('full_name').eq('id', message.sender_id).maybeSingle()).data?.full_name || senderName;
        title = conversation.group_name || 'New group message';
      } else {
        if (conversation.user_a !== userId && conversation.user_b !== userId) return;
        const clearedBefore = conversation.user_a === userId ? conversation.cleared_before_a : conversation.cleared_before_b;
        if (clearedBefore && new Date(message.created_at) <= new Date(clearedBefore)) return;
        senderName = (await supabase.from('profiles').select('full_name').eq('id', message.sender_id).maybeSingle()).data?.full_name || senderName;
        title = senderName;
      }
      if (mutedConversationIds().has(conversation.id)) return;
      sendPortalNotification(userId, 'community', title, `${senderName} sent you a message.`);
    });

    const matchesStudent = (row) => (!row.branch || row.branch === branch)
      && (!row.year || String(row.year) === String(year));
    channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'academic_assignments' }, ({ new: row }) => {
      if (matchesStudent(row)) sendPortalNotification(userId, 'academics', 'New assignment', row.title || 'A new assignment was published.');
    });
    channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'academic_notices' }, ({ new: row }) => {
      if (matchesStudent(row)) sendPortalNotification(userId, 'academics', 'New academic notice', row.title || 'A new notice was published.');
    });
    channel.subscribe((status) => {
      const connectionState = status === 'SUBSCRIBED' ? 'connected'
        : status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' ? 'error' : 'connecting';
      try { localStorage.setItem(`mgm_portal_notifications_connection_${userId}`, connectionState); } catch { /* ignore */ }
      if (connectionState === 'error') console.warn('Portal notification connection failed:', status);
    });
  }

  const session = await requireAuth();           // session nahi to login.html
  if(session){
    let name = session.user.email;
    let roll = 'Signed in';
    let profile = null;
    try{
      const p = await loadProfile();
      if(p){ profile = p; name = p.full_name || name; roll = p.roll_no || roll; }
    }catch(e){ /* profile baad me bhi load ho jayegi */ }
    document.getElementById('profileName').textContent = name;
    document.getElementById('profileId').textContent = roll;
    const avatar = document.getElementById('avatarLetter');
    const avatarUrl = session.user.user_metadata?.avatar_url;
    if (avatarUrl) {
      const image = document.createElement('img');
      image.src = avatarUrl; image.alt = 'Profile picture';
      image.onerror = () => { avatar.textContent = name.trim().charAt(0).toUpperCase() || 'S'; };
      avatar.replaceChildren(image);
    } else avatar.textContent = name.trim().charAt(0).toUpperCase() || 'S';
    startPortalNotifications(session.user.id, profile, session.user.user_metadata || {});
    window.portalAuthReady = true;
    window.loadPortalRoute();
  }

  document.getElementById('logoutBtn').addEventListener('click', () => {
    signOut();
  });
</script>

</body>
</html>
