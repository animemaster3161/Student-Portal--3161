<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MGMCOET Student Login</title>
  <link rel="icon" type="image/jpeg" href="mgmcoet-mark.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #eaf3ff;
      --ink-dim: #a9bdd9;
      --cyan: #5ce1ff;
      --cyan-soft: #8fe9ff;
      --violet: #b98bff;
      --glass: rgba(18, 26, 42, 0.42);
      --glass-border: rgba(180, 220, 255, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      overflow-x: hidden;
      max-width: 100vw;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: #060a12;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- Video background ---------- */
    .bg-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .bg-wrap video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      filter: saturate(1.05) brightness(0.9);
    }

    .bg-scrim {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 90% at 12% 50%, rgba(4, 8, 16, 0.72) 0%, rgba(4, 8, 16, 0.32) 45%, rgba(4, 8, 16, 0.08) 70%),
        linear-gradient(180deg, rgba(3, 6, 12, 0.35) 0%, rgba(3, 6, 12, 0.05) 30%, rgba(3, 6, 12, 0.45) 100%);
    }

    /* ---------- Page frame ---------- */
    .stage {
      position: relative;
      z-index: 2;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 5vh 5vw;
      overflow-y: auto;
    }

    /* ---------- MGM badge, top-right ---------- */
    .mgm-badge {
      position: fixed;
      top: 28px;
      right: 28px;
      z-index: 3;
      padding: 10px 16px;
      background: rgba(14, 20, 34, 0.28);
      border: 1px solid rgba(180, 220, 255, 0.14);
      border-radius: 12px;
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      text-align: right;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      animation: fadeDown .8s ease both;
    }

    .mgm-badge .name {
      font-family: 'Sora', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--ink);
      line-height: 1.2;
    }

    .mgm-badge .name span {
      color: var(--cyan-soft);
    }

    .mgm-badge .sub {
      margin-top: 2px;
      font-size: 9.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-dim);
      font-weight: 500;
    }

    .mgm-badge .dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--cyan);
      margin-right: 5px;
      box-shadow: 0 0 6px var(--cyan);
      animation: pulse 2.4s ease-in-out infinite;
    }

    /* ---------- Login card ---------- */
    .card {
      width: 420px;
      max-width: 90vw;
      padding: 36px 34px 30px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: fadeUp .7s cubic-bezier(.2, .8, .2, 1) both;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cyan-soft);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .eyebrow::before {
      content: "";
      width: 16px;
      height: 1px;
      background: var(--cyan-soft);
      display: inline-block;
    }

    h1 {
      font-family: 'Sora', sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .tagline {
      margin-top: 6px;
      margin-bottom: 28px;
      font-size: 13.5px;
      color: var(--ink-dim);
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--ink-dim);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(6, 12, 22, 0.35);
      border: 1px solid rgba(180, 220, 255, 0.14);
      border-radius: 10px;
      color: var(--ink);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: all .2s ease;
    }

    .input-wrap input::placeholder {
      color: rgba(169, 189, 217, 0.45);
    }

    .input-wrap input:focus {
      border-color: var(--cyan);
      background: rgba(6, 12, 22, 0.55);
      box-shadow: 0 0 0 3px rgba(92, 225, 255, 0.12);
    }

    .toggle-eye {
      position: absolute;
      right: 14px;
      cursor: pointer;
      color: var(--ink-dim);
      display: flex;
      padding: 4px;
    }

    .toggle-eye:hover {
      color: var(--cyan-soft);
    }

    .toggle-eye svg {
      width: 18px;
      height: 18px;
    }

    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 12px;
    }

    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink-dim);
      cursor: pointer;
    }

    .checkbox-wrap input {
      accent-color: var(--cyan);
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .forgot-link {
      color: var(--cyan-soft);
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .resend-link {
      display: block;
      margin: 10px 0 0 auto;
      padding: 0;
      border: 0;
      background: none;
      color: var(--cyan-soft);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .resend-link:hover { text-decoration: underline; }
    .resend-link:disabled { opacity: .65; cursor: wait; }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--cyan) 0%, #6a8fff 55%, var(--violet) 100%);
      color: #06111c;
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: 14.5px;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow: 0 6px 22px rgba(92, 225, 255, 0.25);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(92, 225, 255, 0.38);
      filter: brightness(1.05);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0 20px;
      color: var(--ink-dim);
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(180, 220, 255, 0.14);
    }

    .switch-row {
      text-align: center;
      font-size: 13px;
      color: var(--ink-dim);
    }

    .switch-link {
      color: var(--ink);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid var(--cyan-soft);
      padding-bottom: 1px;
      transition: color .2s ease;
    }

    .switch-link:hover {
      color: var(--cyan-soft);
    }

    .form-message {
      display: none;
      font-size: 12.5px;
      line-height: 1.5;
      padding: 10px 12px;
      border-radius: 9px;
      margin: -4px 0 16px;
    }

    .form-message.show {
      display: block;
      animation: fadeSwap .25s ease both;
    }

    .form-message.error {
      background: rgba(255, 90, 90, 0.1);
      border: 1px solid rgba(255, 90, 90, 0.3);
      color: #ffb3b3;
    }

    .form-message.success {
      background: rgba(92, 225, 255, 0.1);
      border: 1px solid rgba(92, 225, 255, 0.3);
      color: var(--cyan-soft);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeSwap {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    /* ===================== RESPONSIVE ===================== */
    @media (max-width: 900px) {
      .stage {
        justify-content: center;
      }
    }

    @media (max-width: 640px) {
      .stage {
        padding: calc(96px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
        align-items: flex-end;
      }

      .mgm-badge {
        top: calc(14px + env(safe-area-inset-top));
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        text-align: center;
        padding: 8px 18px;
        border-radius: 999px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .mgm-badge .name {
        font-size: 12.5px;
      }

      .mgm-badge .sub {
        font-size: 8.5px;
        margin-top: 1px;
      }

      .card {
        width: 100%;
        max-width: 440px;
        padding: 28px 24px 26px;
        border-radius: 18px;
      }

      h1 {
        font-size: 24px;
      }

      .input-wrap input {
        font-size: 16px;
        padding: 14px 16px;
      }

      .btn-primary {
        min-height: 50px;
        font-size: 15px;
      }
    }

    @media (max-height: 480px) and (orientation: landscape) {
      .stage {
        padding: 14px 18px;
        align-items: center;
      }

      .mgm-badge {
        top: 10px;
        right: 10px;
        left: auto;
        transform: none;
        text-align: right;
        flex-direction: column;
        padding: 6px 12px;
      }

      .card {
        padding: 20px 24px;
      }

      .tagline {
        margin-bottom: 18px;
      }

      .field {
        margin-bottom: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- Video Background -->
  <div class="bg-wrap">
    <video autoplay muted loop playsinline preload="auto">
      <source src="bg.mp4" type="video/mp4">
    </video>
    <div class="bg-scrim"></div>
  </div>

  <!-- Top Right Badge -->
  <div class="mgm-badge">
    <div class="name"><span class="dot"></span>MGMCOET</div>
    <div class="sub">Unofficial Student Portal</div>
  </div>

  <div class="stage">
    <div class="card">

      <div class="eyebrow">Welcome Back</div>
      <h1>Sign in</h1>
      <p class="tagline">Access your student portal, academic records, and resources.</p>

      <form id="loginForm" onsubmit="return false;">

        <div class="field">
          <label for="loginId">Roll Number or Email</label>
          <div class="input-wrap">
            <input type="text" id="loginId" placeholder="e.g. 2200290100XX" required>
          </div>
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <div class="input-wrap">
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
            <span class="toggle-eye" onclick="togglePassword('loginPassword', this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </span>
          </div>
        </div>

        <div class="options-row">
          <label class="checkbox-wrap">
            <input type="checkbox" id="rememberMe">
            Remember this device
          </label>
          <a href="forgot_password.html" class="forgot-link">Forgot password?</a>
        </div>
        <button class="resend-link" id="resendVerificationBtn" type="button">Resend verification email</button>

        <div class="form-message" id="loginMessage"></div>

        <button class="btn-primary" type="submit">Sign in</button>
      </form>

      <div class="divider">OR</div>

      <div class="switch-row">
        Don't have an account?
        <a href="signup.html" class="switch-link"
          style="position: relative; z-index: 10; cursor: pointer;">Create an account</a>
      </div>

    </div>
  </div>

  <script type="module">
    import { signIn, redirectIfLoggedIn, setChatKeyRemembered, resendVerificationEmail } from './auth.js';

    window.togglePassword = function (id, el) {
      const input = document.getElementById(id);
      const isPass = input.type === 'password';
      input.type = isPass ? 'text' : 'password';
      el.style.color = isPass ? 'var(--cyan-soft)' : '';
    };
    function showMessage(el, text, type) { el.textContent = text; el.className = 'form-message show ' + type; }
    function clearMessage(el) { el.textContent = ''; el.className = 'form-message'; }

    redirectIfLoggedIn();   // session persist: pehle se logged-in ho to seedha portal

    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');
    const btn = loginForm.querySelector('.btn-primary');
    const resendButton = document.getElementById('resendVerificationBtn');

    resendButton.addEventListener('click', async () => {
      clearMessage(loginMessage);
      const id = document.getElementById('loginId').value.trim();
      const password = document.getElementById('loginPassword').value;
      resendButton.disabled = true;
      try {
        const result = await resendVerificationEmail({ id, password });
        showMessage(loginMessage, result.alreadyVerified
          ? `This Firebase email is already verified (${result.email}). If sign-in still fails, use the password reset link.`
          : `Verification email sent to ${result.email}. Check Inbox and Spam/Junk.`, 'success');
      } catch (error) {
        showMessage(loginMessage, error.message || 'Unable to resend verification email.', 'error');
      } finally {
        resendButton.disabled = false;
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessage(loginMessage);
      const id = document.getElementById('loginId').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!id || !password) { showMessage(loginMessage, 'Please fill in both fields.', 'error'); return; }

      btn.disabled = true;
      showMessage(loginMessage, 'Authenticating...', 'success');
      try {
        const { user } = await signIn({ id, password });
        await setChatKeyRemembered(user.id, document.getElementById('rememberMe').checked);
        showMessage(loginMessage, 'Success! Redirecting to your dashboard...', 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 600);
      } catch (err) {
        showMessage(loginMessage, err.message || 'Login failed.', 'error');
        btn.disabled = false;
      }
    });
  </script>

</body>

</html>
