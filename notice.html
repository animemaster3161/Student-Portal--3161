<!DOCTYPE html>
<html lang="en">

<head>
    <script>if (window.top !== window.self) { document.write('<style>.sidebar{display:none!important}.main-content{margin-left:0!important;width:100%!important}</style>'); }</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | All Notices</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #EEF3FD;
            --surface: #FFFFFF;
            --surface-alt: #F2F6FE;
            --ink: #0F1B33;
            --ink-soft: #536079;
            --ink-faint: #96A1BC;
            --blue: #2E5CE6;
            --blue-light: #6C93FF;
            --blue-deep: #1A38A6;
            --blue-wash: rgba(46, 92, 230, 0.09);
            --indigo: #6355E0;
            --indigo-light: #9088F0;
            --indigo-wash: rgba(99, 85, 224, 0.09);
            --cyan: #0DA5C0;
            --cyan-light: #4FD3E8;
            --cyan-wash: rgba(13, 165, 192, 0.09);
            --amber: #D6900F;
            --amber-light: #F0B94A;
            --amber-wash: rgba(214, 144, 15, 0.11);
            --danger: #E14A3B;
            --danger-light: #F28E7C;
            --danger-wash: rgba(225, 74, 59, 0.08);
            --success: #1DA35F;
            --border: rgba(15, 27, 51, 0.08);
            --shadow-sm: 0 2px 10px rgba(15, 27, 51, 0.05);
            --shadow-md: 0 14px 32px rgba(15, 27, 51, 0.08);
            --shadow-lg: 0 26px 56px rgba(20, 40, 100, 0.16);
            --sidebar-width: 272px;
            --ease: cubic-bezier(.22, 1, .36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
            max-width: 100vw;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-base);
            color: var(--ink);
            display: flex;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-x: hidden;
        }

        .mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .mesh span {
            position: absolute;
            border-radius: 50%;
            filter: blur(95px);
            opacity: 0.55;
            animation: drift 24s ease-in-out infinite alternate;
        }

        .mesh span:nth-child(1) {
            width: 560px;
            height: 560px;
            top: -180px;
            right: -140px;
            background: radial-gradient(circle, rgba(46, 92, 230, 0.30), transparent 70%);
        }

        .mesh span:nth-child(2) {
            width: 460px;
            height: 460px;
            bottom: -160px;
            left: 18%;
            background: radial-gradient(circle, rgba(99, 85, 224, 0.20), transparent 70%);
            animation-delay: -8s;
        }

        .mesh span:nth-child(3) {
            width: 420px;
            height: 420px;
            top: 32%;
            right: 8%;
            background: radial-gradient(circle, rgba(13, 165, 192, 0.18), transparent 70%);
            animation-delay: -14s;
        }

        ::selection {
            background: var(--blue-light);
            color: #fff;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--blue-light);
            outline-offset: 3px;
            border-radius: 8px;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, #0A1230 0%, #101E4C 55%, #142A63 100%);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 10;
            overflow: hidden;
        }

        .sidebar::before {
            content: "";
            position: absolute;
            width: 320px;
            height: 320px;
            top: -110px;
            left: -110px;
            background: radial-gradient(circle, rgba(108, 147, 255, 0.25), transparent 70%);
            filter: blur(40px);
            pointer-events: none;
        }

        .sidebar>* {
            position: relative;
            z-index: 1;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            padding: 0 6px;
        }

        .logo-mark {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            background: linear-gradient(145deg, var(--blue-light), var(--blue-deep));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1), 0 10px 22px rgba(46, 92, 230, 0.4);
            flex-shrink: 0;
        }

        .logo-text {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 16.5px;
            color: #fff;
            letter-spacing: 0.2px;
            line-height: 1.15;
        }

        .logo-text span {
            display: block;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 0.4px;
            margin-top: 2px;
        }

        .nav-section-label {
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.32);
            text-transform: uppercase;
            margin: 32px 12px 12px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-links li a {
            color: rgba(255, 255, 255, 0.64);
            font-weight: 500;
            font-size: 14.5px;
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 11px 14px;
            border-radius: 12px;
            position: relative;
            transition: color .25s var(--ease), background-color .25s var(--ease), transform .25s var(--ease);
        }

        .nav-links li a i {
            width: 18px;
            text-align: center;
            font-size: 15px;
        }

        .nav-links li a:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            transform: translateX(2px);
        }

        .nav-links li a.active {
            background: linear-gradient(120deg, var(--blue-light), var(--blue));
            color: #fff;
            box-shadow: 0 10px 24px rgba(46, 92, 230, 0.38);
        }

        .profile-mini {
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .profile-mini .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--cyan-light), var(--cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            flex-shrink: 0;
        }

        .profile-mini .info {
            flex: 1;
            min-width: 0;
        }

        .profile-mini .info strong {
            display: block;
            font-size: 13px;
            color: #fff;
            font-weight: 600;
        }

        .profile-mini .info span {
            font-size: 11.5px;
            color: rgba(255, 255, 255, 0.42);
            font-family: 'JetBrains Mono', monospace;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 36px 46px 60px;
            width: calc(100% - var(--sidebar-width));
            position: relative;
            z-index: 1;
        }

        .page-head {
            position: relative;
            background: radial-gradient(620px 300px at 100% 0%, rgba(255, 255, 255, 0.16), transparent 60%), radial-gradient(500px 260px at 0% 100%, rgba(79, 211, 232, 0.35), transparent 60%), linear-gradient(120deg, #16309E 0%, #2E5CE6 48%, #0DA5C0 100%);
            border-radius: 24px;
            padding: 28px 32px;
            box-shadow: 0 22px 48px rgba(26, 56, 166, 0.28);
            margin-bottom: 26px;
            overflow: hidden;
            opacity: 0;
            transform: translateY(14px);
            animation: cardIn .7s var(--ease) forwards;
        }

        .page-head::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.16) 1px, transparent 1px);
            background-size: 18px 18px;
            mask-image: linear-gradient(120deg, rgba(0, 0, 0, 0.5), transparent 55%);
            pointer-events: none;
        }

        .page-head-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
            gap: 15px;
        }

        .eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            font-weight: 600;
            color: #DCE8FF;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .eyebrow .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #6CF0B0;
            box-shadow: 0 0 0 0 rgba(108, 240, 176, 0.5);
            animation: dotPulse 2.4s infinite;
        }

        .page-head h1 {
            font-family: 'Sora', sans-serif;
            color: #fff;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        .page-head p {
            color: rgba(255, 255, 255, 0.78);
            font-size: 13.5px;
            margin-top: 7px;
        }

        .count-pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.28);
            padding: 10px 16px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .filter-bar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px 22px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 24px;
            opacity: 0;
            transform: translateY(14px);
            animation: cardIn .6s var(--ease) .08s forwards;
        }

        .level-toggle {
            display: inline-flex;
            background: var(--surface-alt);
            border-radius: 30px;
            padding: 4px;
            gap: 4px;
            margin-bottom: 16px;
        }

        .level-toggle button {
            border: none;
            background: transparent;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 13px;
            color: var(--ink-soft);
            padding: 9px 20px;
            border-radius: 24px;
            transition: background .3s var(--ease), color .3s var(--ease), box-shadow .3s var(--ease);
        }

        .level-toggle button.active {
            background: linear-gradient(120deg, var(--blue-light), var(--blue));
            color: #fff;
            box-shadow: 0 8px 18px rgba(46, 92, 230, 0.32);
        }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
            background: var(--surface-alt);
            color: var(--ink-soft);
            font-weight: 600;
            font-size: 12.5px;
            padding: 9px 16px;
            border-radius: 24px;
            cursor: pointer;
            transition: background .25s var(--ease), color .25s var(--ease), transform .25s var(--ease), border-color .25s var(--ease);
        }

        .chip i {
            font-size: 12px;
        }

        .chip:hover {
            transform: translateY(-2px);
        }

        .chip.active {
            background: var(--ink);
            color: #fff;
            border-color: var(--ink);
        }

        .chip.active[data-category="exams"] {
            background: var(--amber);
            border-color: var(--amber);
        }

        .chip.active[data-category="holidays"] {
            background: var(--success);
            border-color: var(--success);
        }

        .chip.active[data-category="events"] {
            background: var(--indigo);
            border-color: var(--indigo);
        }

        .chip.active[data-category="placements"] {
            background: var(--cyan);
            border-color: var(--cyan);
        }

        .notice-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .notice-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 22px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: transform .35s var(--ease), box-shadow .35s var(--ease);
            opacity: 0;
            transform: translateY(16px);
            animation: cardIn .55s var(--ease) forwards;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .notice-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .notice-card.hidden {
            display: none;
        }

        .notice-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .cat-tag {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            padding: 6px 12px;
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
        }

        .cat-tag.exams {
            background: var(--amber-wash);
            color: var(--amber);
        }

        .cat-tag.holidays {
            background: rgba(29, 163, 95, 0.1);
            color: var(--success);
        }

        .cat-tag.events {
            background: var(--indigo-wash);
            color: var(--indigo);
        }

        .cat-tag.placements {
            background: var(--cyan-wash);
            color: var(--cyan);
        }

        .level-tag {
            font-size: 10px;
            font-weight: 600;
            color: var(--ink-faint);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 20px;
            white-space: nowrap;
            text-transform: capitalize;
        }

        .notice-title {
            font-family: 'Sora', sans-serif;
            font-size: 15.5px;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.4;
        }

        .notice-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            color: var(--ink-faint);
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .notice-desc {
            font-size: 13px;
            color: var(--ink-soft);
            line-height: 1.5;
            background: var(--surface-alt);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .notice-cta {
            margin-top: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            background: linear-gradient(145deg, var(--blue-light), var(--blue-deep));
            color: #fff;
            font-weight: 600;
            font-size: 13px;
            padding: 12px 16px;
            border-radius: 13px;
            box-shadow: 0 10px 22px rgba(46, 92, 230, 0.28);
            transition: transform .25s var(--ease), box-shadow .25s var(--ease), gap .25s var(--ease);
        }

        .notice-cta:hover {
            transform: translateY(-2px);
            gap: 12px;
            box-shadow: 0 14px 28px rgba(46, 92, 230, 0.38);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--ink-faint);
            font-size: 14px;
            display: none;
        }

        .empty-state i {
            font-size: 30px;
            margin-bottom: 14px;
            display: block;
            color: var(--ink-faint);
        }

        .empty-state.show {
            display: block;
        }

        @keyframes cardIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes dotPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(29, 163, 95, 0.45);
            }

            70% {
                box-shadow: 0 0 0 9px rgba(29, 163, 95, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(29, 163, 95, 0);
            }
        }

        @keyframes drift {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(-40px, 30px) scale(1.08);
            }
        }

        @media (max-width: 1080px) {
            .notice-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 780px) {
            .sidebar {
                display: none;
            }

            .main-content {
                margin-left: 0;
                width: 100%;
                padding: 22px;
            }

            .page-head-top {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
            }

            .chip-row {
                gap: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="mesh"><span></span><span></span><span></span></div>

    <nav class="sidebar">
        <div class="logo">
            <div class="logo-mark">MG</div>
            <div class="logo-text">MGMCOET<span>Student Portal</span></div>
        </div>
        <div class="nav-section-label">Menu</div>
        <ul class="nav-links">
            <li><a href="#"><i class="fas fa-grip"></i> Dashboard</a></li>
            <li><a href="#"><i class="fas fa-user"></i> My Profile</a></li>
            <li><a href="#" class="active"><i class="fas fa-bullhorn"></i> All Notices</a></li>
            <li><a href="#"><i class="fas fa-book"></i> Academics</a></li>
        </ul>
        <div class="profile-mini">
            <div class="avatar">P</div>
            <div class="info"><strong>Priyansh Kumar</strong><span>2200156</span></div>
        </div>
    </nav>

    <main class="main-content">
        <section class="page-head">
            <div class="page-head-top">
                <div>
                    <div class="eyebrow"><span class="dot"></span> NOTICE BOARD</div>
                    <h1>All Notices</h1>
                    <p>Every university &amp; college circular, in one place.</p>
                </div>
                <div class="count-pill"><i class="fas fa-thumbtack"></i> <span id="resultCount">0</span> Notices</div>
            </div>
        </section>

        <section class="filter-bar">
            <div class="level-toggle" id="levelToggle">
                <button class="active" data-level="all">All</button>
                <button data-level="university">University Level</button>
                <button data-level="college">College Level</button>
            </div>
            <div class="chip-row" id="categoryChips">
                <button class="chip active" data-category="all"><i class="fas fa-border-all"></i> All</button>
                <button class="chip" data-category="exams"><i class="fas fa-file-alt"></i> Exams</button>
                <button class="chip" data-category="holidays"><i class="fas fa-umbrella-beach"></i> Holidays</button>
                <button class="chip" data-category="events"><i class="fas fa-calendar-star"></i> Events</button>
                <button class="chip" data-category="placements"><i class="fas fa-briefcase"></i> Placements</button>
            </div>
        </section>

        <div class="notice-grid" id="noticeGrid">
            <div class="empty-state show" id="loadingState">
                <i class="fas fa-spinner fa-spin"></i> Loading notices from database...
            </div>
            <div class="empty-state" id="emptyState">
                <i class="fas fa-folder-open"></i> No notices match this filter.
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- YOUR EXACT FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDT5PWeMm85EScNPaxU6QoE4VoISPAg4eQ",
            authDomain: "mgm-coet-unoffical.firebaseapp.com",
            databaseURL: "https://mgm-coet-unoffical-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "mgm-coet-unoffical",
            storageBucket: "mgm-coet-unoffical.firebasestorage.app",
            messagingSenderId: "456186174768",
            appId: "1:456186174768:web:bfb84d17df5ca242ee3cf5",
            measurementId: "G-2PSJWK1GNM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let activeLevel = 'all'; let activeCategory = 'all'; let allNotices = [];
        const loadingState = document.getElementById('loadingState');
        const emptyState = document.getElementById('emptyState');
        const resultCount = document.getElementById('resultCount');

        function formatDate(ms) {
            const d = new Date(ms);
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            return `${d.getDate().toString().padStart(2, '0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
        }

        async function loadNotices() {
            try {
                const querySnapshot = await getDocs(collection(db, "notices"));
                allNotices = [];
                querySnapshot.forEach((doc) => { allNotices.push({ id: doc.id, ...doc.data() }); });
                allNotices.sort((a, b) => b.timestamp - a.timestamp);
                renderNotices();
            } catch (error) {
                console.error("Error fetching notices:", error);
                loadingState.innerHTML = "Error loading notices. Check database setup.";
            }
        }

        function renderNotices() {
            document.querySelectorAll('.notice-card').forEach(el => el.remove());
            loadingState.classList.remove('show');
            let visible = 0;

            allNotices.forEach(r => {
                const matchLevel = activeLevel === 'all' || r.level === activeLevel;
                const matchCategory = activeCategory === 'all' || r.category === activeCategory;

                if (matchLevel && matchCategory) {
                    visible++;
                    let iconClass = 'fa-file-alt';
                    if (r.category === 'holidays') iconClass = 'fa-umbrella-beach';
                    if (r.category === 'events') iconClass = 'fa-calendar-star';
                    if (r.category === 'placements') iconClass = 'fa-briefcase';

                    const cardHtml = `
                <div class="notice-card" data-level="${r.level}" data-category="${r.category}">
                    <div class="notice-top">
                        <span class="cat-tag ${r.category}"><i class="fas ${iconClass}"></i> ${r.category}</span>
                        <span class="level-tag">${r.level}</span>
                    </div>
                    <div class="notice-title">${r.title}</div>
                    <div class="notice-date"><i class="fas fa-clock"></i> ${formatDate(r.timestamp)}</div>
                    ${r.text ? `<div class="notice-desc">${r.text.replace(/\n/g, '<br>')}</div>` : ''}
                    ${r.fileUrl ? `<a class="notice-cta" href="${r.fileUrl}" target="_blank" rel="noopener"><i class="fas fa-paperclip"></i> View Attached Document</a>` : ''}
                </div>`;
                    emptyState.insertAdjacentHTML('beforebegin', cardHtml);
                }
            });
            resultCount.textContent = visible;
            emptyState.classList.toggle('show', visible === 0);
        }

        const levelBtns = document.querySelectorAll('#levelToggle button');
        const chipBtns = document.querySelectorAll('#categoryChips .chip');

        levelBtns.forEach(btn => btn.addEventListener('click', () => {
            levelBtns.forEach(b => b.classList.remove('active')); btn.classList.add('active');
            activeLevel = btn.dataset.level; renderNotices();
        }));

        chipBtns.forEach(chip => chip.addEventListener('click', () => {
            chipBtns.forEach(c => c.classList.remove('active')); chip.classList.add('active');
            activeCategory = chip.dataset.category; renderNotices();
        }));

        loadNotices();
    </script>
</body>

</html>
