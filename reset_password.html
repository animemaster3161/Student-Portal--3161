<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060a12">
  <script>
    if (['localhost', '127.0.0.1', '::1', '[::1]'].includes(window.location.hostname)) {
      const productionResetUrl = new URL('/reset_password.html', 'https://student-omega-fawn.vercel.app');
      productionResetUrl.search = window.location.search;
      productionResetUrl.hash = window.location.hash;
      window.location.replace(productionResetUrl.href);
    }
  </script>
  <title>Set New Password | MGMCOET Student Portal</title>
  <link rel="icon" type="image/svg+xml" href="assets/mgmcoet-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="password-recovery.css">
</head>
<body>
  <div class="bg-wrap" aria-hidden="true">
    <video autoplay muted loop playsinline preload="metadata"><source src="bg.mp4" type="video/mp4"></video>
    <div class="bg-scrim"></div>
  </div>

  <div class="mgm-badge">
    <div class="name">MGMCOET</div>
    <div class="sub">Unofficial Student Portal</div>
  </div>

  <main class="stage">
    <section class="card" aria-labelledby="pageTitle">
      <div class="eyebrow">Account recovery</div>
      <h1 id="pageTitle">Set a new password</h1>
      <p class="tagline">Choose a new password for your student portal account.</p>

      <div id="recoveryStatus" class="form-message show info" role="status" aria-live="polite">Checking your secure reset link…</div>
      <form id="passwordForm" hidden>
        <div class="field">
          <label for="newPassword">New password</label>
          <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="6" required>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>
        </div>
        <div id="passwordMessage" class="form-message" role="status" aria-live="polite"></div>
        <button id="updatePasswordButton" class="btn-primary" type="submit">Update password</button>
      </form>

      <nav class="page-links" aria-label="Account links">
        <a id="loginLink" href="login.html" hidden>Continue to sign in</a>
        <a id="requestLink" href="forgot_password.html" hidden>Request a new reset link</a>
      </nav>
    </section>
  </main>

  <script type="module">
    import { supabase } from './supabase-config.js';

    const form = document.getElementById('passwordForm');
    const status = document.getElementById('recoveryStatus');
    const message = document.getElementById('passwordMessage');
    const loginLink = document.getElementById('loginLink');
    const requestLink = document.getElementById('requestLink');
    const button = document.getElementById('updatePasswordButton');

    function showMessage(element, text, type) {
      element.textContent = text;
      element.className = `form-message show ${type}`;
    }

    async function checkRecoverySession() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('error') || params.has('error_code')) {
        throw new Error('This reset link is invalid or has expired. Request a new one to continue.');
      }

      const { data, error } = await supabase.auth.getSession();
      if (error || !data.session) {
        throw new Error('This reset link is invalid or has expired. Request a new one to continue.');
      }

      status.hidden = true;
      form.hidden = false;
    }

    checkRecoverySession().catch((error) => {
      showMessage(status, error.message, 'error');
      requestLink.hidden = false;
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('newPassword').value;
      const confirmation = document.getElementById('confirmPassword').value;
      if (password.length < 6) {
        showMessage(message, 'Use at least 6 characters for your password.', 'error');
        return;
      }
      if (password !== confirmation) {
        showMessage(message, 'The passwords do not match.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'Updating…';
      message.className = 'form-message';
      try {
        const { error } = await supabase.auth.updateUser({ password });
        if (error) throw error;
        try { await supabase.auth.signOut(); } catch { /* password is already updated */ }
        form.hidden = true;
        status.hidden = false;
        showMessage(status, 'Your password has been updated. You can now sign in with it.', 'success');
        loginLink.hidden = false;
      } catch (error) {
        showMessage(message, error.message || 'Unable to update your password. Request a new reset link.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'Update password';
      }
    });
  </script>
</body>
</html>
