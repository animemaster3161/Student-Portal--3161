<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MGMCOET Student Registration</title>
  <link rel="icon" type="image/jpeg" href="mgmcoet-mark.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eaf3ff;
    --ink-dim:#a9bdd9;
    --cyan:#5ce1ff;
    --cyan-soft:#8fe9ff;
    --violet:#b98bff;
    --glass:rgba(18,26,42,0.42);
    --glass-border:rgba(180,220,255,0.16);
    --glass-hi:rgba(255,255,255,0.06);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
html{overflow-x:hidden;max-width:100vw;}

  html,body{
    height:100%;
    width:100%;
    overflow:hidden;
    font-family:'Inter',sans-serif;
    background:#060a12;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- Video background ---------- */
  .bg-wrap{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:0;
  }
  .bg-wrap video{
    position:absolute;
    top:50%; left:50%;
    min-width:100%; min-height:100%;
    width:auto; height:auto;
    transform:translate(-50%,-50%);
    object-fit:cover;
    filter:saturate(1.05) brightness(0.9);
  }
  .bg-scrim{
    position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 12% 50%, rgba(4,8,16,0.72) 0%, rgba(4,8,16,0.32) 45%, rgba(4,8,16,0.08) 70%),
      linear-gradient(180deg, rgba(3,6,12,0.35) 0%, rgba(3,6,12,0.05) 30%, rgba(3,6,12,0.45) 100%);
  }

  /* ---------- Page frame ---------- */
  .stage{
    position:relative;
    z-index:2;
    height:100vh;
    height:100dvh;
    width:100vw;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    padding:5vh 5vw;
    overflow-y:auto;
  }

  /* ---------- MGM badge, top-right ---------- */
  .mgm-badge{
    position:fixed;
    top:28px;
    right:28px;
    z-index:3;
    padding:10px 16px;
    background:rgba(14,20,34,0.28);
    border:1px solid rgba(180,220,255,0.14);
    border-radius:12px;
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    text-align:right;
    box-shadow:0 4px 20px rgba(0,0,0,0.2);
    animation:fadeDown .8s ease both;
  }
  .mgm-badge .name{
    font-family:'Sora',sans-serif;
    font-size:13.5px;
    font-weight:700;
    letter-spacing:0.06em;
    color:var(--ink);
    line-height:1.2;
  }
  .mgm-badge .name span{
    color:var(--cyan-soft);
  }
  .mgm-badge .sub{
    margin-top:2px;
    font-size:9.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-dim);
    font-weight:500;
  }
  .mgm-badge .dot{
    display:inline-block;
    width:5px;height:5px;
    border-radius:50%;
    background:var(--cyan);
    margin-right:5px;
    box-shadow:0 0 6px var(--cyan);
    animation:pulse 2.4s ease-in-out infinite;
  }

  /* ---------- Registration card ---------- */
  .card{
    width:420px;
    max-width:90vw;
    max-height:88vh;
    overflow-y:auto;
    padding:36px 34px 30px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:20px;
    backdrop-filter:blur(22px) saturate(150%);
    -webkit-backdrop-filter:blur(22px) saturate(150%);
    box-shadow:
      0 8px 40px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.08);
    animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both;
    scrollbar-width:thin;
    scrollbar-color:rgba(92,225,255,0.35) transparent;
  }
  .card::-webkit-scrollbar{ width:6px; }
  .card::-webkit-scrollbar-track{ background:transparent; }
  .card::-webkit-scrollbar-thumb{
    background:rgba(92,225,255,0.3);
    border-radius:10px;
  }
  .card::-webkit-scrollbar-thumb:hover{ background:rgba(92,225,255,0.5); }

  .eyebrow{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--cyan-soft);
    font-weight:600;
    margin-bottom:10px;
  }
  .eyebrow::before{
    content:"";
    width:16px;height:1px;
    background:var(--cyan-soft);
    display:inline-block;
  }

  h1{
    font-family:'Sora',sans-serif;
    font-size:26px;
    font-weight:700;
    color:var(--ink);
    letter-spacing:-0.01em;
  }
  .tagline{
    margin-top:6px;
    margin-bottom:24px;
    font-size:13px;
    color:var(--ink-dim);
    line-height:1.5;
  }

  .field{
    margin-bottom:16px;
  }
  .field-row{
    display:flex;
    gap:12px;
  }
  .field-row .field{
    flex:1;
    min-width:0;
  }
  .field-hint{
    margin-top:6px;
    font-size:11px;
    line-height:1.4;
    color:var(--ink-dim);
  }
  .keyword-same-option{display:flex;align-items:center;gap:7px;margin:0 0 8px;color:var(--ink-dim);font-size:11.5px;line-height:1.35;cursor:pointer}
  .keyword-same-option input{width:14px;height:14px;margin:0;accent-color:var(--cyan);flex:0 0 auto}
  .field label{
    display:block;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:0.03em;
    color:var(--ink-dim);
    margin-bottom:7px;
  }
  .input-wrap{
    position:relative;
    display:flex;
    align-items:center;
  }
  .input-wrap input{
    width:100%;
    padding:12px 14px;
    min-height:46px;
    background:rgba(6,12,22,0.35);
    border:1px solid rgba(180,220,255,0.14);
    border-radius:10px;
    color:var(--ink);
    font-size:13.5px;
    font-family:'Inter',sans-serif;
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .input-wrap input::placeholder{ color:rgba(169,189,217,0.45); }
  .input-wrap input:focus{
    border-color:var(--cyan);
    background:rgba(6,12,22,0.55);
    box-shadow:0 0 0 3px rgba(92,225,255,0.12);
  }
  .input-wrap input:disabled{
    color:var(--ink-dim);
    background:rgba(6,12,22,0.22);
    border-color:rgba(180,220,255,0.08);
    cursor:not-allowed;
  }
  .select-wrap select{
    width:100%;
    padding:12px 34px 12px 14px;
    background:rgba(6,12,22,0.35);
    border:1px solid rgba(180,220,255,0.14);
    border-radius:10px;
    color:var(--ink);
    font-size:13.5px;
    font-family:'Inter',sans-serif;
    outline:none;
    appearance:none;
    -webkit-appearance:none;
    cursor:pointer;
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238fe9ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;
    background-position:right 12px center;
    background-size:14px;
  }
  .select-wrap select:focus{
    border-color:var(--cyan);
    background-color:rgba(6,12,22,0.55);
    box-shadow:0 0 0 3px rgba(92,225,255,0.12);
  }
  .select-wrap select option{
    background:#0e1522;
    color:var(--ink);
  }
  .toggle-eye{
    position:absolute;
    right:12px;
    cursor:pointer;
    color:var(--ink-dim);
    display:flex;
    padding:2px;
  }
  .toggle-eye:hover{ color:var(--cyan-soft); }
  .toggle-eye svg{ width:17px; height:17px; }

  .btn-primary{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg, var(--cyan) 0%, #6a8fff 55%, var(--violet) 100%);
    color:#06111c;
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.01em;
    cursor:pointer;
    box-shadow:0 6px 22px rgba(92,225,255,0.25);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 8px 28px rgba(92,225,255,0.38); filter:brightness(1.05); }
  .btn-primary:active{ transform:translateY(0); }

  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:22px 0 18px;
    color:var(--ink-dim);
    font-size:11px;
    letter-spacing:0.05em;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:rgba(180,220,255,0.14);
  }

  .switch-row{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-dim);
  }
  .switch-link{
    color:var(--ink);
    font-weight:600;
    text-decoration:none;
    border-bottom:1px solid var(--cyan-soft);
    padding-bottom:1px;
    transition:color .2s ease;
  }
  .switch-link:hover{ color:var(--cyan-soft); }

  .form-message{
    display:none;
    font-size:12.5px;
    line-height:1.5;
    padding:10px 12px;
    border-radius:9px;
    margin:-4px 0 16px;
  }
  .form-message.show{ display:block; animation:fadeSwap .25s ease both; }
  .form-message.error{
    background:rgba(255,90,90,0.1);
    border:1px solid rgba(255,90,90,0.3);
    color:#ffb3b3;
  }
  .form-message.success{
    background:rgba(92,225,255,0.1);
    border:1px solid rgba(92,225,255,0.3);
    color:var(--cyan-soft);
  }
  .btn-resend{
    width:100%;
    margin:0 0 14px;
    padding:12px;
    border:1px solid rgba(143,233,255,0.35);
    border-radius:10px;
    background:rgba(92,225,255,0.08);
    color:var(--cyan-soft);
    font:600 13px 'Inter',sans-serif;
    cursor:pointer;
  }
  .btn-resend:hover{ background:rgba(92,225,255,0.14); }
  .btn-resend:disabled{ opacity:.65; cursor:wait; }
  .redirect-countdown{
    margin:0 0 14px;
    color:var(--ink-dim);
    font-size:12px;
    text-align:center;
  }
  .btn-primary:disabled{
    opacity:0.6;
    cursor:not-allowed;
    transform:none !important;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes fadeDown{
    from{ opacity:0; transform:translateY(-10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes fadeSwap{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.35; }
  }

  /* ===================== RESPONSIVE ===================== */

  @media (max-width: 900px){
    .stage{ justify-content:center; }
  }

  @media (max-width: 640px){
    .stage{
      justify-content:center;
      align-items:flex-end;
      padding:calc(96px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
    }
    .mgm-badge{
      top:calc(14px + env(safe-area-inset-top));
      left:50%;
      right:auto;
      transform:translateX(-50%);
      text-align:center;
      padding:8px 18px;
      border-radius:999px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    .mgm-badge .name{ font-size:12.5px; }
    .mgm-badge .sub{ font-size:8.5px; margin-top:1px; }

    .card{
      width:100%;
      max-width:440px;
      padding:26px 22px 22px;
      border-radius:18px;
      max-height:calc(100dvh - 96px - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 28px);
      overflow-y:auto;
    }

    h1{ font-size:22px; }
    .tagline{ font-size:12.5px; margin-bottom:20px; }
    .field{ margin-bottom:14px; }

    .input-wrap input{ font-size:16px; padding:12px 14px; }
    .select-wrap select{ font-size:16px; }
    .toggle-eye{ padding:8px; right:4px; }
    .btn-primary{ padding:14px; font-size:14.5px; min-height:48px; }
    .field-row{ flex-direction:column; gap:0; }
  }

  @media (max-width: 380px){
    .card{ padding:22px 18px 18px; }
    h1{ font-size:20px; }
    .eyebrow{ font-size:10px; }
    .mgm-badge{ padding:7px 14px; }
    .mgm-badge .name{ font-size:11.5px; }
  }

  @media (max-height: 480px) and (orientation: landscape){
    .stage{
      align-items:center;
      padding:14px 18px;
    }
    .mgm-badge{
      top:10px; right:10px; left:auto; transform:none;
      text-align:right; flex-direction:column; padding:6px 12px;
    }
    .card{
      max-height:calc(100dvh - 20px);
      overflow-y:auto;
      padding:18px 24px;
    }
    .tagline{ margin-bottom:14px; }
    .field{ margin-bottom:10px; }
    .divider{ margin:14px 0 12px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>

  <div class="bg-wrap">
    <video autoplay muted loop playsinline preload="auto">
      <!-- Make sure bg.mp4 is in the same folder -->
      <source src="bg.mp4" type="video/mp4">
    </video>
    <div class="bg-scrim"></div>
  </div>

  <div class="mgm-badge">
    <div class="name"><span class="dot"></span>MGMCOET</div>
    <div class="sub">Unofficial Student Portal</div>
  </div>

  <div class="stage">
    <div class="card">

      <div class="form-panel active" id="signupPanel">
        <div class="eyebrow">Join the Portal</div>
        <h1>Create account</h1>
        <p class="tagline">Register with your student details to get started.</p>

        <form id="signupForm" onsubmit="return false;" class="signup-form">
          <div class="field">
            <label for="signupName">Full name</label>
            <div class="input-wrap">
              <input type="text" id="signupName" placeholder="Your full name" required>
            </div>
          </div>

          <div class="field">
            <label for="signupEmail">Email address</label>
            <div class="input-wrap">
              <input type="email" id="signupEmail" placeholder="you@mgmcollege.edu" required>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="signupBranch">Branch</label>
              <div class="input-wrap select-wrap">
                <select id="signupBranch" required>
                  <option value="" disabled selected>Select branch</option>
                  <option>Computer Science &amp; Engineering</option>
                  <option>Information Technology</option>
                  <option>Electronics &amp; Communication</option>
                  <option>Electrical Engineering</option>
                  <option>Mechanical Engineering</option>
                  <option>Civil Engineering</option>
                  <option>Other</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label for="signupYear">Year</label>
              <div class="input-wrap select-wrap">
                <select id="signupYear" required>
                  <option value="" disabled selected>Select</option>
                  <option>1st Year</option>
                  <option>2nd Year</option>
                  <option>3rd Year</option>
                  <option>4th Year</option>
                </select>
              </div>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="signupRoll">Roll number</label>
              <div class="input-wrap">
                <input type="text" id="signupRoll" placeholder="e.g. 2200290100XX" required>
              </div>
            </div>
            <div class="field">
              <label for="signupSemester">Semester</label>
              <div class="input-wrap select-wrap">
                <select id="signupSemester" required>
                  <option value="" disabled selected>Select</option>
                  <option>1</option><option>2</option><option>3</option><option>4</option>
                  <option>5</option><option>6</option><option>7</option><option>8</option>
                </select>
              </div>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="signupCollege">College</label>
              <div class="input-wrap">
                <input type="text" id="signupCollege" value="Mahatma Gandhi Mission College" disabled>
              </div>
            </div>
            <div class="field">
              <label for="signupUniversity">University</label>
              <div class="input-wrap">
                <input type="text" id="signupUniversity" value="AKTU" disabled>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="signupPassword">Password</label>
            <div class="input-wrap">
              <input type="password" id="signupPassword" placeholder="Create a password" required>
              <span class="toggle-eye" onclick="togglePassword('signupPassword', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </span>
            </div>
          </div>

          <div class="field">
            <label for="signupKeyword">Security keyword</label>
            <label class="keyword-same-option" for="keywordSameAsPassword">
              <input type="checkbox" id="keywordSameAsPassword">
              Use my password as my security keyword
            </label>
            <div class="input-wrap">
              <input type="text" id="signupKeyword" placeholder="A word only you'd remember" required>
            </div>
            <div class="field-hint">Required to restore your chat keys on a new device. Store it safely; it cannot be recovered.</div>
          </div>

          <div class="form-message" id="signupMessage"></div>
          <button class="btn-resend" id="resendSignupEmailBtn" type="button" hidden>Resend verification email</button>
          <p class="redirect-countdown" id="signupRedirectStatus" hidden></p>

          <button class="btn-primary" type="submit" style="margin-top:6px;">Create account</button>
        </form>

        <div class="divider">OR</div>

        <div class="switch-row">
          Already have an account? <a href="login.html" class="switch-link">Sign in</a>
        </div>
      </div>

    </div>
  </div>

<script type="module">
  import { signUp, redirectIfLoggedIn, resendVerificationEmail } from './auth.js';

  window.togglePassword = function(id, el){
    const input = document.getElementById(id);
    const isPass = input.type === 'password';
    input.type = isPass ? 'text' : 'password';
    el.style.color = isPass ? 'var(--cyan-soft)' : '';
  };
  function showMessage(el, text, type){ el.textContent = text; el.className = 'form-message show ' + type; }
  function clearMessage(el){ el.textContent = ''; el.className = 'form-message'; }

  redirectIfLoggedIn();

  const signupForm = document.getElementById('signupForm');
  const signupMessage = document.getElementById('signupMessage');
  const resendSignupEmailBtn = document.getElementById('resendSignupEmailBtn');
  const signupRedirectStatus = document.getElementById('signupRedirectStatus');
  const btn = signupForm.querySelector('.btn-primary');
  const v = (id) => document.getElementById(id).value.trim();
  const passwordInput = document.getElementById('signupPassword');
  const keywordInput = document.getElementById('signupKeyword');
  const sameKeywordOption = document.getElementById('keywordSameAsPassword');
  let customKeyword = keywordInput.value;
  let resendCredentials = null;
  let loginCountdownTimer = null;

  function scheduleLoginRedirect() {
    let seconds = 60;
    signupRedirectStatus.hidden = false;
    signupRedirectStatus.textContent = `You can resend the email now. Redirecting to sign in in ${seconds} seconds.`;
    loginCountdownTimer = setInterval(() => {
      seconds -= 1;
      if (seconds > 0) {
        signupRedirectStatus.textContent = `You can resend the email now. Redirecting to sign in in ${seconds} seconds.`;
      } else {
        signupRedirectStatus.textContent = 'Opening the sign-in page…';
        clearInterval(loginCountdownTimer);
      }
    }, 1000);
    setTimeout(() => { window.location.replace('login.html'); }, 60000);
  }

  resendSignupEmailBtn.addEventListener('click', async () => {
    if (!resendCredentials) return;
    resendSignupEmailBtn.disabled = true;
    const oldLabel = resendSignupEmailBtn.textContent;
    resendSignupEmailBtn.textContent = 'Sending verification email…';
    try {
      const result = await resendVerificationEmail(resendCredentials);
      showMessage(signupMessage, result.alreadyVerified
        ? `This email address is already verified (${result.email}).`
        : `Verification email resent to ${result.email}. Check your Inbox and Spam/Junk.`, 'success');
    } catch (error) {
      showMessage(signupMessage, error.message || 'Unable to resend the verification email.', 'error');
    } finally {
      resendSignupEmailBtn.disabled = false;
      resendSignupEmailBtn.textContent = oldLabel;
    }
  });

  passwordInput.addEventListener('input', () => {
    if (sameKeywordOption.checked) keywordInput.value = passwordInput.value;
  });
  sameKeywordOption.addEventListener('change', () => {
    if (sameKeywordOption.checked) {
      customKeyword = keywordInput.value;
      keywordInput.value = passwordInput.value;
      keywordInput.disabled = true;
    } else {
      keywordInput.disabled = false;
      keywordInput.value = customKeyword;
    }
  });
  keywordInput.addEventListener('input', () => {
    if (!sameKeywordOption.checked) customKeyword = keywordInput.value;
  });

  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMessage(signupMessage);

    const password = document.getElementById('signupPassword').value;
    const data = {
      name: v('signupName'), email: v('signupEmail'), roll: v('signupRoll'),
      branch: v('signupBranch'), year: v('signupYear'), semester: v('signupSemester'),
      keyword: v('signupKeyword'), password
    };
    if(!data.name || !data.email || !password || !data.roll){
      showMessage(signupMessage, 'Please fill in all fields.', 'error'); return;
    }
    if(password.length < 6){
      showMessage(signupMessage, 'Password must be at least 6 characters.', 'error'); return;
    }

    btn.disabled = true;
    showMessage(signupMessage, 'Creating account and generating your encryption keys...', 'success');
    try{
      const { needsEmailConfirm, emailVerificationSent, emailAlreadyVerified, emailVerificationError } = await signUp(data);
      if(needsEmailConfirm){
        resendCredentials = { id: data.email, password: data.password };
        resendSignupEmailBtn.hidden = false;
        btn.textContent = 'Account created';
        const emailStatus = emailVerificationSent
          ? 'Verification email sent. Check your Inbox and Spam/Junk.'
          : emailAlreadyVerified
            ? 'Your email address is already verified.'
            : `We could not send the verification email. ${emailVerificationError} Retry it with the button below.`;
        showMessage(signupMessage, `Account created. ${emailStatus} ${emailVerificationSent || emailAlreadyVerified ? 'Confirm any portal email link too, then sign in.' : ''}`, emailVerificationSent || emailAlreadyVerified ? 'success' : 'error');
        scheduleLoginRedirect();
      }else{
        showMessage(signupMessage, 'Account created! Redirecting...', 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 900);
      }
    }catch(err){
      showMessage(signupMessage, err.message || 'Signup failed.', 'error');
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
